# Sentinel observability stack (local only).
#
# Ingests the apps' JSON logs (one file per variant in the sentinel-logs
# volume) into Elasticsearch, viewable in Kibana. The optional `wazuh` profile
# adds a Wazuh manager that runs the custom rules in wazuh/local_rules.xml.
#
# Security: xpack security is disabled for the local demo, so every published
# port is bound to 127.0.0.1 and Elasticsearch is never reachable from the LAN.
# Do not expose these ports on a shared host. No credentials live in this file;
# all tunables come from the environment (see ../.env.example) and default to
# safe local values.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.15.3}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.15.3}
    # The config is mounted read-only from the host, so it is not owned by the
    # beat user. --strict.perms=false lets Filebeat accept that mount.
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - sentinel-logs:/var/log/sentinel:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  app-fixed:
    build:
      context: ../apps/fixed
    environment:
      SENTINEL_LOG_DIR: /var/log/sentinel
      SENTINEL_SECRET_KEY: ${SENTINEL_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${FIXED_PORT:-5002}:5002"
    volumes:
      - sentinel-logs:/var/log/sentinel
    restart: unless-stopped

  wazuh-manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.9.2}
    profiles: ["wazuh"]
    volumes:
      - ./wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - sentinel-logs:/var/log/sentinel:ro
    restart: unless-stopped

volumes:
  es-data:
  sentinel-logs:
