<!--
  Sentinel log collection snippet for the Wazuh manager.

  NOT MOUNTED. The compose file mounts only local_rules.xml and the
  sentinel-logs volume, so with the wazuh profile the manager does not read
  /var/log/sentinel/*.log and the rules in local_rules.xml never fire end to
  end. This snippet has not been run.

  Manual merge (untested; for a local demo stack only):
    1. Copy the manager's default config out of the container, with the
       wazuh profile enabled:
         COMPOSE_PROFILES=wazuh docker compose cp wazuh-manager:/var/ossec/etc/ossec.conf ./ossec.conf.merged
       (run from the observability/ directory)
    2. In ./ossec.conf.merged, insert the <localfile> block from this file
       just before the closing </ossec_config> tag. Keep the rest unchanged.
    3. Mount the merged file read-only over the default config by adding this
       line under wazuh-manager volumes in docker-compose.yml:
         - ./wazuh/ossec.conf.merged:/var/ossec/etc/ossec.conf:ro
    4. Restart the wazuh-manager service and check the manager log for the
       sentinel-logs location.
-->
<ossec_config>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/sentinel/*.log</location>
  </localfile>
</ossec_config>
